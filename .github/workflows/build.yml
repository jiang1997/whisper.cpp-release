name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
          - os: windows-latest
            artifact: windows-x64
          - os: macos-latest
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan SDK (Windows & Linux)
        if: "startsWith(matrix.os, 'ubuntu-') || matrix.os == 'windows-latest'"
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install Linux dependencies
        if: "startsWith(matrix.os, 'ubuntu-')"
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev

      - name: Add MSBuild to PATH (Windows)
        uses: microsoft/setup-msbuild@v2
        if: runner.os == 'Windows'

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'project.*whisper.cpp.*VERSION' whisper.cpp/CMakeLists.txt | sed -n 's/.*VERSION \([0-9.]*\).*/\1/p')
          if [ -z "$VERSION" ]; then echo "Could not extract version from whisper.cpp/CMakeLists.txt" >&2; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ── Linux build ──────────────────────────────────────────────
      - name: Configure (Linux)
        if: "startsWith(matrix.os, 'ubuntu-')"
        run: |
          cmake -S whisper.cpp -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_VULKAN=1 \
            -DGGML_NATIVE=OFF \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON

      # ── Windows build ────────────────────────────────────────────
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S whisper.cpp -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGML_VULKAN=1 `
            -DGGML_NATIVE=OFF `
            -DCMAKE_C_FLAGS="-D_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR" `
            -DCMAKE_CXX_FLAGS="-D_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR" `
            -DCMAKE_C_COMPILER_WORKS=TRUE `
            -DCMAKE_CXX_COMPILER_WORKS=TRUE

      # ── macOS ARM build ──────────────────────────────────────────
      - name: Configure (macOS ARM)
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: |
          cmake -S whisper.cpp -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DWHISPER_COREML=1

      # ── macOS Intel build ────────────────────────────────────────
      - name: Configure (macOS Intel)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: |
          cmake -S whisper.cpp -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_VULKAN=0 \
            -DGGML_METAL=0

      # ── Build ────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build -j --config Release --verbose

      # ── Package ──────────────────────────────────────────────────
      - name: Package (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "release/whisper-${{ steps.version.outputs.version }}-${{ matrix.artifact }}"
          cp build/bin/whisper-cli "release/whisper-${{ steps.version.outputs.version }}-${{ matrix.artifact }}/"
          cp build/bin/whisper-server "release/whisper-${{ steps.version.outputs.version }}-${{ matrix.artifact }}/"
          cp -P build/src/libwhisper.* "release/whisper-${{ steps.version.outputs.version }}-${{ matrix.artifact }}/" 2>/dev/null || true
          cp -P build/ggml/src/libggml* "release/whisper-${{ steps.version.outputs.version }}-${{ matrix.artifact }}/" 2>/dev/null || true
          cp -P build/ggml/src/ggml-vulkan/libggml-vulkan.so* "release/whisper-${{ steps.version.outputs.version }}-${{ matrix.artifact }}/" 2>/dev/null || true
          cd release && tar -czf "whisper-${{ steps.version.outputs.version }}-${{ matrix.artifact }}.tar.gz" "whisper-${{ steps.version.outputs.version }}-${{ matrix.artifact }}/"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "release/whisper-${{ steps.version.outputs.version }}-${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $dir
          Copy-Item build/bin/Release/whisper-cli.exe $dir/
          Copy-Item build/bin/Release/whisper-server.exe $dir/
          Compress-Archive -Path $dir -DestinationPath "release/whisper-${{ steps.version.outputs.version }}-${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-${{ matrix.artifact }}
          path: release/whisper-*
          if-no-files-found: error

  build-sycl-linux:
    runs-on: ubuntu-24.04
    continue-on-error: true

    env:
      LEVEL_ZERO_VERSION: "1.28.2"
      LEVEL_ZERO_UBUNTU_VERSION: "u24.04"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Intel oneAPI
        run: |
          cd /tmp
          wget -q https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          sudo apt-key add GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          rm GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          echo "deb https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            intel-oneapi-compiler-dpcpp-cpp \
            intel-oneapi-mkl-devel

      - name: Install Level Zero SDK
        run: |
          cd /tmp
          wget -q "https://github.com/oneapi-src/level-zero/releases/download/v${LEVEL_ZERO_VERSION}/level-zero_${LEVEL_ZERO_VERSION}%2B${LEVEL_ZERO_UBUNTU_VERSION}_amd64.deb" -O level-zero.deb
          wget -q "https://github.com/oneapi-src/level-zero/releases/download/v${LEVEL_ZERO_VERSION}/level-zero-devel_${LEVEL_ZERO_VERSION}%2B${LEVEL_ZERO_UBUNTU_VERSION}_amd64.deb" -O level-zero-devel.deb
          sudo apt-get install -y ./level-zero.deb ./level-zero-devel.deb

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'project.*whisper.cpp.*VERSION' whisper.cpp/CMakeLists.txt | sed -n 's/.*VERSION \([0-9.]*\).*/\1/p')
          if [ -z "$VERSION" ]; then echo "Could not extract version from whisper.cpp/CMakeLists.txt" >&2; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure (Linux SYCL)
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake -S whisper.cpp -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_SYCL=ON \
            -DGGML_VULKAN=OFF \
            -DGGML_NATIVE=OFF \
            -DCMAKE_C_COMPILER=icx \
            -DCMAKE_CXX_COMPILER=icpx \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON

      - name: Build
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake --build build -j --config Release --verbose

      - name: Package (Linux SYCL)
        run: |
          mkdir -p "release/whisper-${{ steps.version.outputs.version }}-linux-x64-sycl"
          cp build/bin/whisper-cli "release/whisper-${{ steps.version.outputs.version }}-linux-x64-sycl/"
          cp build/bin/whisper-server "release/whisper-${{ steps.version.outputs.version }}-linux-x64-sycl/"
          cp -P build/src/libwhisper.* "release/whisper-${{ steps.version.outputs.version }}-linux-x64-sycl/" 2>/dev/null || true
          cp -P build/ggml/src/libggml* "release/whisper-${{ steps.version.outputs.version }}-linux-x64-sycl/" 2>/dev/null || true
          cp -P build/ggml/src/ggml-sycl/libggml-sycl.so* "release/whisper-${{ steps.version.outputs.version }}-linux-x64-sycl/" 2>/dev/null || true
          cd release && tar -czf "whisper-${{ steps.version.outputs.version }}-linux-x64-sycl.tar.gz" "whisper-${{ steps.version.outputs.version }}-linux-x64-sycl/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-linux-x64-sycl
          path: release/whisper-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'project.*whisper.cpp.*VERSION' whisper.cpp/CMakeLists.txt | sed -n 's/.*VERSION \([0-9.]*\).*/\1/p')
          if [ -z "$VERSION" ]; then echo "Could not extract version from whisper.cpp/CMakeLists.txt" >&2; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: whisper-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Whisper.cpp ${{ steps.version.outputs.version }}
          body: |
            Prebuilt binaries of [whisper.cpp](https://github.com/ggerganov/whisper.cpp) v${{ steps.version.outputs.version }}.

            Each archive contains `whisper-cli` and `whisper-server`.

            **GPU support:** Vulkan on Windows/Linux, CoreML on macOS Apple Silicon, SYCL (Intel GPU/CPU) on Linux x86_64.
          files: release/*
